<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رفد — تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#12201D}
*{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
a{color:#0E6E5C}a:hover{color:#0A5446}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font:600 16px/1 'IBM Plex Sans Arabic',sans-serif;border:0;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#0E6E5C;color:#fff}.btn-p:hover{background:#0A5446;color:#fff}
.muted{color:#4B5B57}
.label{font-size:14px;font-weight:600;color:#2B3A36}
.input{width:100%;height:48px;border:1px solid #CFD8D5;border-radius:12px;padding:0 14px;font:400 16px 'IBM Plex Sans Arabic',sans-serif;color:#12201D;background:#fff}
</style>
</helmet>
<div style="width:100%;min-height:900px;display:flex;flex-wrap:wrap;background:#fff">
  <main style="flex:999 1 520px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 24px">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:28px">
      <a href="Landing.dc.html" aria-label="رفد — الرئيسية"><img src="assets/raved-logo-green.svg" alt="شعار رفد" style="height:64px;width:auto"></a>
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 style="font-size:32px;font-weight:700">أهلاً بعودتك</h1>
        <p class="muted" style="font-size:16px">سجّل دخولك لتكمل من حيث توقفت.</p>
      </div>
      <form style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label class="label" for="email">البريد الإلكتروني</label>
          <input class="input" id="email" type="email" dir="ltr" style="text-align:right" placeholder="name@example.com" autocomplete="email">
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><label class="label" for="pw">كلمة المرور</label><a href="Forgot.dc.html" style="font-size:14px;font-weight:600">نسيت كلمة المرور؟</a></div>
          <input class="input" id="pw" type="password" autocomplete="current-password">
        </div>
        <button class="btn btn-p" type="button">تسجيل الدخول</button>
      </form>
      <p class="muted" style="font-size:15px;text-align:center">ليس لديك حساب؟ <a href="Signup.dc.html" style="font-weight:600">أنشئ حساباً</a></p>
    </div>
  </main>
  <aside style="flex:1 1 440px;background:#0E6E5C;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:56px;gap:40px" aria-label="عن رفد">
    <img src="assets/raved-logo-green-white.svg" alt="" style="height:120px;width:auto;align-self:flex-start">
    <div style="display:flex;flex-direction:column;gap:16px;max-width:460px">
      <p style="font-size:30px;font-weight:700;line-height:1.5">كل درس تكمله اليوم خطوة نحو مهارة تبقى معك.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:#0A5446;font-size:14px;font-weight:600">مسارات منظمة</span>
        <span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:#0A5446;font-size:14px;font-weight:600">يعمل بلا إنترنت</span>
        <span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;background:#F5A524;color:#12201D;font-size:14px;font-weight:600">مجاناً</span>
      </div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
