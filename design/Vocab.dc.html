<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رفد — مراجعة المفردات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F7F6;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#12201D}
*{box-sizing:border-box}
h1,h2,h3,h4,p{margin:0}
a{color:#0E6E5C}a:hover{color:#0A5446}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 18px;border-radius:14px;font:600 16px/1.2 'IBM Plex Sans Arabic',sans-serif;border:0;cursor:pointer;text-decoration:none;flex-direction:column}
.btn-s{background:#fff;color:#12201D;border:1px solid #CFD8D5}.btn-s:hover{background:#F5F7F6;color:#12201D}
.muted{color:#4B5B57}
.en{font-family:'Inter',system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
</style>
</helmet>
<div style="width:100%;min-height:900px;background:#F5F7F6;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E2E8E6;min-height:68px;padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <a href="StudentHome.dc.html" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>إنهاء</a>
    <div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px">
      <p style="font-weight:700">مراجعة اليوم · {{ done }} من 18</p>
      <div style="height:6px;border-radius:99px;background:#E2E8E6;max-width:420px;overflow:hidden"><span style="{{ barStyle }}"></span></div>
    </div>
    <span class="muted" style="font-size:14px">نحو 5 دقائق</span>
  </header>
  <main style="width:100%;max-width:640px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:20px">
    <section style="background:#fff;border:1px solid #E2E8E6;border-radius:24px;min-height:340px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;box-shadow:0 20px 40px -24px rgba(18,32,29,.2)" aria-live="polite">
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:#EEF2F1;color:#34433F;font-size:12px;font-weight:600">{{ card.unit }}</span>
      <p class="en" style="font-size:44px;font-weight:700">{{ card.word }}</p>
      <button aria-label="استمع للنطق" style="width:48px;height:48px;border-radius:999px;border:0;background:#E3F2EE;color:#0A5446;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
      <sc-if value="{{ flipped }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:12px;border-top:1px solid #EEF2F1;width:100%">
          <p style="font-size:26px;font-weight:700;color:#0E6E5C">{{ card.meaning }}</p>
          <p class="en" style="font-size:17px">{{ card.example }}</p>
          <p class="muted" style="font-size:15px">{{ card.exampleAr }}</p>
        </div>
      </sc-if>
    </section>
    <sc-if value="{{ notFlipped }}" hint-placeholder-val="{{ true }}">
      <button class="btn" type="button" onClick="{{ flip }}" style="background:#0E6E5C;color:#fff;width:100%">اعرض المعنى</button>
    </sc-if>
    <sc-if value="{{ flipped }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
        <button class="btn btn-s" type="button" onClick="{{ next }}" style="border-color:#FDA29B"><span style="color:#B42318">نسيتها</span><span class="muted" style="font-size:12px;font-weight:500">غداً</span></button>
        <button class="btn btn-s" type="button" onClick="{{ next }}" style="border-color:#F5D58C"><span style="color:#8A5A00">صعبة</span><span class="muted" style="font-size:12px;font-weight:500">بعد 3 أيام</span></button>
        <button class="btn btn-s" type="button" onClick="{{ next }}" style="border-color:#A6D9BF"><span style="color:#087443">عرفتها</span><span class="muted" style="font-size:12px;font-weight:500">بعد 9 أيام</span></button>
      </div>
    </sc-if>
    <p class="muted" style="font-size:14px;text-align:center;line-height:1.8">كل كلمة تعود إليك قبل أن تنساها بقليل. كلما عرفتها أكثر، طالت المدة حتى تراها مرة أخرى.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, flipped: false };
  }
  renderVals() {
    const cards = [
      { unit: 'الوحدة 5', word: 'receipt', meaning: 'إيصال / فاتورة', example: 'Can I have the receipt, please?', exampleAr: 'ممكن الإيصال من فضلك؟' },
      { unit: 'الوحدة 5', word: 'discount', meaning: 'خصم', example: 'Is there a discount on these shoes?', exampleAr: 'هل يوجد خصم على هذا الحذاء؟' },
      { unit: 'الوحدة 4', word: 'usually', meaning: 'عادةً', example: 'I usually wake up at seven.', exampleAr: 'أستيقظ عادةً في السابعة.' },
      { unit: 'الوحدة 5', word: 'fit', meaning: 'يناسب (المقاس)', example: 'This jacket doesn’t fit me.', exampleAr: 'هذه السترة ليست على مقاسي.' }
    ];
    const i = this.state.i % cards.length;
    const done = 7 + this.state.i;
    return {
      card: cards[i],
      flipped: this.state.flipped,
      notFlipped: !this.state.flipped,
      done: done,
      barStyle: 'display:block;height:100%;background:#0E6E5C;width:' + Math.min(100, Math.round(done / 18 * 100)) + '%',
      flip: () => this.setState({ flipped: true }),
      next: () => this.setState({ i: this.state.i + 1, flipped: false })
    };
  }
}
</script>
</body>
</html>
